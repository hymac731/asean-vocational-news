<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>东盟职教情报</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0A0B;
      --surface: #141416;
      --surface2: #1C1C1F;
      --border: rgba(255,255,255,0.08);
      --text: #FAFAFA;
      --text-2: #8A8A8E;
      --text-3: #5C5C5E;
      --accent: #FF4D00;
      --accent-dim: rgba(255,77,0,0.15);
      --amber: #FFB300;
      --green: #00C853;
      --blue: #2979FF;
      --purple: #A855F7;
      --radius: 16px;
      --radius-sm: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,10,11,0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
    .header-title span { color: var(--accent); }
    .header-meta { font-size: 12px; color: var(--text-2); }

    /* ── Map Container ── */
    .map-wrap {
      position: fixed; top: 56px; left: 0; bottom: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(255,77,0,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(41,121,255,0.04) 0%, transparent 60%);
    }
    .map-svg { width: 100%; height: 100%; }
    .country-path {
      fill: rgba(255,255,255,0.06);
      stroke: rgba(255,255,255,0.12);
      stroke-width: 0.5;
      cursor: pointer;
      transition: fill 0.25s ease, stroke 0.25s ease, filter 0.25s ease;
    }
    .country-path:hover {
      fill: rgba(255,77,0,0.2);
      stroke: rgba(255,77,0,0.5);
    }
    .country-path.active {
      fill: rgba(255,77,0,0.3);
      stroke: var(--accent);
      stroke-width: 1.5;
      filter: drop-shadow(0 0 12px rgba(255,77,0,0.4));
    }
    .country-label {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 11px;
      fill: rgba(255,255,255,0.5);
      pointer-events: none;
      font-weight: 500;
    }
    .country-label.active-label {
      fill: var(--accent);
    }

    /* ── Side Panel ── */
    .panel {
      position: fixed;
      top: 56px; right: 0; bottom: 0;
      width: 380px;
      background: rgba(20,20,22,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      overflow-y: auto;
      z-index: 50;
    }
    .panel.open { transform: translateX(0); }
    .panel::-webkit-scrollbar { width: 4px; }
    .panel::-webkit-scrollbar-track { background: transparent; }
    .panel::-webkit-scrollbar-thumb { background: var(--text-3); border-radius: 2px; }

    .panel-header {
      position: sticky; top: 0;
      background: rgba(20,20,22,0.98);
      border-bottom: 1px solid var(--border);
      padding: 20px 20px 16px;
      z-index: 2;
    }
    .panel-country {
      font-size: 22px; font-weight: 700; margin-bottom: 4px;
    }
    .panel-country-flag { display: inline-block; margin-right: 8px; font-size: 20px; }
    .panel-count { font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
    .panel-tabs { display: flex; gap: 6px; }
    .tab {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      color: var(--text-2);
      background: transparent;
      transition: all 0.2s;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .panel-close {
      position: absolute; top: 16px; right: 16px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-2);
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .panel-close:hover { color: var(--text); }

    /* ── Articles ── */
    .article-list { padding: 12px 16px; }
    .article-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .article-card:hover {
      border-color: rgba(255,77,0,0.3);
      background: var(--surface2);
    }
    .article-meta { display: flex; gap: 8px; margin-bottom: 8px; }
    .tag {
      font-size: 10px; font-weight: 500; letter-spacing: 0.5px;
      padding: 2px 7px; border-radius: 4px;
    }
    .tag-cat { background: rgba(255,77,0,0.15); color: var(--accent); }
    .tag-src { background: rgba(255,255,255,0.06); color: var(--text-2); }
    .article-title { font-size: 13px; font-weight: 500; line-height: 1.5; margin-bottom: 6px; }
    .article-date { font-size: 11px; color: var(--text-3); }
    .article-summary {
      font-size: 12px; color: var(--text-2); line-height: 1.6;
      margin-top: 6px; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ── Country Grid (left side) ── */
    .country-grid {
      position: fixed;
      top: 72px; left: 16px;
      display: flex; flex-direction: column; gap: 6px;
      z-index: 10;
    }
    .country-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: rgba(20,20,22,0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .country-btn:hover { border-color: var(--accent); background: rgba(255,77,0,0.1); }
    .country-btn.active { border-color: var(--accent); background: var(--accent-dim); }
    .country-btn-flag { font-size: 16px; }
    .country-btn-name { font-size: 13px; font-weight: 500; }
    .country-btn-count {
      font-size: 10px; background: var(--surface2);
      padding: 1px 6px; border-radius: 10px; color: var(--text-2);
    }

    /* ── Empty State ── */
    .empty-state {
      padding: 40px 20px; text-align: center; color: var(--text-2);
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
    .empty-text { font-size: 14px; }

    /* ── Hero hint ── */
    .hero-hint {
      position: fixed;
      bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(20,20,22,0.9);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 20px;
      font-size: 12px; color: var(--text-2);
      backdrop-filter: blur(10px);
      pointer-events: none;
      transition: opacity 0.5s;
    }
    .hero-hint.hidden { opacity: 0; }

    /* ── Stats bar ── */
    .stats-bar {
      position: fixed;
      bottom: 24px; right: 20px;
      display: flex; gap: 16px;
      background: rgba(20,20,22,0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 16px;
      backdrop-filter: blur(10px);
      font-size: 11px; color: var(--text-2);
      z-index: 10;
    }
    .stat-item span { color: var(--accent); font-weight: 600; margin-right: 4px; }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-title"><span>●</span> 东盟职教情报</div>
  <div class="header-meta" id="update-time">加载中…</div>
</header>

<!-- Country buttons (left sidebar) -->
<div class="country-grid" id="country-grid"></div>

<!-- Map -->
<div class="map-wrap">
  <svg class="map-svg" id="map-svg" viewBox="60 10 100 100" preserveAspectRatio="xMidYMid meet">
    <g id="countries-group"></g>
  </svg>
</div>

<!-- Side panel -->
<div class="panel" id="panel">
  <div class="panel-header">
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div class="panel-country" id="panel-country"></div>
    <div class="panel-count" id="panel-count"></div>
    <div class="panel-tabs" id="panel-tabs"></div>
  </div>
  <div class="article-list" id="article-list"></div>
</div>

<!-- Hero hint -->
<div class="hero-hint" id="hero-hint">👆 点击左侧国家或地图查看资讯</div>

<!-- Stats bar -->
<div class="stats-bar">
  <div class="stat-item"><span id="stat-total">—</span>条资讯</div>
  <div class="stat-item"><span>10</span>个国家</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
// ─── ASEAN Countries config ───
const ASEAN_COUNTRIES = [
  { code: 'KHM', name: '柬埔寨', flag: '🇰🇭', en: 'Cambodia', altNames: ['Cambodia', 'Kampuchea', 'KHM'] },
  { code: 'LAO', name: '老挝', flag: '🇱🇦', en: 'Laos', altNames: ['Laos', 'Lao PDR', 'LAO'] },
  { code: 'VNM', name: '越南', flag: '🇻🇳', en: 'Vietnam', altNames: ['Vietnam', 'Viet Nam', 'VNM'] },
  { code: 'THA', name: '泰国', flag: '🇹🇭', en: 'Thailand', altNames: ['Thailand', 'THA'] },
  { code: 'MMR', name: '缅甸', flag: '🇲🇲', en: 'Myanmar', altNames: ['Myanmar', 'Burma', 'MMR'] },
  { code: 'MYS', name: '马来西亚', flag: '🇲🇾', en: 'Malaysia', altNames: ['Malaysia', 'MYS'] },
  { code: 'SGP', name: '新加坡', flag: '🇸🇬', en: 'Singapore', altNames: ['Singapore', 'SGP'] },
  { code: 'IDN', name: '印度尼西亚', flag: '🇮🇩', en: 'Indonesia', altNames: ['Indonesia', 'IDN'] },
  { code: 'BRN', name: '文莱', flag: '🇧🇳', en: 'Brunei', altNames: ['Brunei', 'Brunei Darussalam', 'BRN'] },
  { code: 'PHL', name: '菲律宾', flag: '🇵🇭', en: 'Philippines', altNames: ['Philippines', 'PHL'] },
];

// Country ISO numeric codes in natural-earth / world-atlas
const ISO_NUMERIC = {
  KHM: 116, LAO: 418, VNM: 704, THA: 764, MMR: 104,
  MYS: 458, SGP: 702, IDN: 360, BRN: 96, PHL: 608
};

// ─── Category config ───
const CATEGORIES = {
  existing_cooperation: { label: '合作项目', color: '#FF4D00' },
  policy: { label: '政策动态', color: '#2979FF' },
  platform: { label: '平台动态', color: '#00C853' },
};

const CAT_LIST = ['existing_cooperation', 'policy', 'platform'];

// ─── Load data ───
let allArticles = [];
let filteredArticles = [];
let activeCountry = null;
let activeCat = null;

async function loadData() {
  try {
    const resp = await fetch('output/asean_vocational_news.json');
    const data = await resp.json();
    allArticles = data.articles || [];
    document.getElementById('stat-total').textContent = allArticles.length;
    const t = data.generated_at;
    document.getElementById('update-time').textContent = t ? `最后更新: ${t.slice(0,10)}` : '';
  } catch (e) {
    // use embedded sample data
    allArticles = EMBEDDED_ARTICLES;
    document.getElementById('stat-total').textContent = allArticles.length;
  }
  buildCountryGrid();
  renderMap();
  // auto-select first country with data
  const c = ASEAN_COUNTRIES.find(x => getArticles(x.code).length > 0);
  if (c) selectCountry(c.code);
}

// ─── Get articles for a country ───
function getArticles(countryCode) {
  const country = ASEAN_COUNTRIES.find(c => c.code === countryCode);
  if (!country) return [];
  const matchNames = [country.en, country.code, ...(country.altNames || [])];
  return allArticles.filter(a => {
    const cs = (a.countries || []).map(c => c.trim());
    const isPanASEAN = cs.includes('ASEAN') && cs.length === 1;
    const isSpecific = cs.some(c => matchNames.some(m => c.toUpperCase().includes(m.toUpperCase())));
    // Pan-ASEAN platform entries visible for all countries; specific entries only for matching country
    return isSpecific || (isPanASEAN && a.category === 'platform');
  });
}

// ─── Build country grid ───
function buildCountryGrid() {
  const grid = document.getElementById('country-grid');
  ASEAN_COUNTRIES.forEach(c => {
    const count = getArticles(c.code).length;
    const btn = document.createElement('button');
    btn.className = 'country-btn';
    btn.id = `btn-${c.code}`;
    btn.onclick = () => selectCountry(c.code);
    btn.innerHTML = `
      <span class="country-btn-flag">${c.flag}</span>
      <span class="country-btn-name">${c.name}</span>
      ${count > 0 ? `<span class="country-btn-count">${count}</span>` : ''}
    `;
    grid.appendChild(btn);
  });
}

// ─── Select country ───
function selectCountry(code) {
  activeCountry = code;
  activeCat = null;

  // Update buttons
  document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${code}`)?.classList.add('active');

  // Update map
  document.querySelectorAll('.country-path').forEach(p => {
    p.classList.toggle('active', p.dataset.code === code);
  });
  document.querySelectorAll('.country-label').forEach(l => {
    l.classList.toggle('active-label', l.dataset.code === code);
  });

  const country = ASEAN_COUNTRIES.find(c => c.code === code);
  const arts = getArticles(code);
  filteredArticles = arts;

  // Open panel
  const panel = document.getElementById('panel');
  panel.classList.add('open');
  document.getElementById('panel-country').innerHTML =
    `<span class="panel-country-flag">${country.flag}</span>${country.name}`;
  document.getElementById('panel-count').textContent = `共 ${arts.length} 条资讯`;

  // Tabs
  const tabsEl = document.getElementById('panel-tabs');
  tabsEl.innerHTML = `
    <button class="tab active" onclick="setCat(null, this)">全部</button>
    ${CAT_LIST.map(cat => `
      <button class="tab" data-cat="${cat}" onclick="setCat('${cat}', this)">
        ${CATEGORIES[cat].label}
      </button>
    `).join('')}
  `;

  renderArticles(arts);

  // Hide hint
  document.getElementById('hero-hint').classList.add('hidden');
}

function setCat(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('.panel-tabs .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const arts = cat ? filteredArticles.filter(a => a.category === cat) : filteredArticles;
  renderArticles(cat ? arts : filteredArticles);
}

function renderArticles(arts) {
  const list = document.getElementById('article-list');
  if (!arts.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无资讯</div></div>`;
    return;
  }
  list.innerHTML = arts.map(a => {
    const cat = CATEGORIES[a.category] || { label: '其他' };
    const date = a.date ? a.date.slice(0,10) : '';
    const sp = (a.specialties || []).slice(0,3).join(' / ');
    return `
    <div class="article-card" onclick="window.open('${a.url}', '_blank')">
      <div class="article-meta">
        <span class="tag tag-cat">${cat.label}</span>
        <span class="tag tag-src">${a.source || ''}</span>
      </div>
      <div class="article-title">${a.title}</div>
      ${sp ? `<div class="article-summary">${sp}</div>` : ''}
      ${a.summary ? `<div class="article-summary">${a.summary}</div>` : ''}
      <div class="article-date" style="margin-top:8px">${date}</div>
    </div>
  `}).join('');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.country-path').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.country-label').forEach(l => l.classList.remove('active-label'));
  activeCountry = null;
}

// ─── Render Map ───
function renderMap() {
  const svg = d3.select('#countries-group');
  const path = d3.geoPath();

  // Load world topology, filter ASEAN
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(topology => {
    const countries = topojson.feature(topology, topology.objects.countries);
    const targetIds = new Set(Object.values(ISO_NUMERIC));

    ASEAN_COUNTRIES.forEach(c => {
      const numId = ISO_NUMERIC[c.code];
      const feat = countries.features.find(f => f.id == numId);
      if (!feat) return;

      const proj = d3.geoNaturalEarth1()
        .fitSize([800, 500], feat)
        .translate([400, 250]);

      const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const d = path(proj(feat));
      if (!d) return;
      pathEl.setAttribute('d', d);
      pathEl.setAttribute('class', 'country-path');
      pathEl.setAttribute('data-code', c.code);
      pathEl.setAttribute('id', `path-${c.code}`);
      pathEl.onclick = () => selectCountry(c.code);
      svg.node().appendChild(pathEl);

      // Label at centroid
      const centroid = path.centroid(feat);
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', centroid[0]);
      label.setAttribute('y', centroid[1]);
      label.setAttribute('class', 'country-label');
      label.setAttribute('data-code', c.code);
      label.setAttribute('id', `label-${c.code}`);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('dominant-baseline', 'middle');
      label.textContent = c.flag;
      svg.node().appendChild(label);
    });
  }).catch(console.error);
}

// ─── Init ───
loadData();
</script>
</body>
</html>
