      position: relative;
      overflow: hidden;
    }

      left: 0;
      right: 0;
      bottom: 0;

      font-weight: 900;
      margin-bottom: 12px;
      letter-spacing: -0.02em;

      opacity: 0.9;

      font-weight: 400;
    }

      gap: 32px;
      flex-wrap: wrap;

    }

    .header-meta span {

      align-items: center;
      gap: 8px;

    }

      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* Filter bar */
    .filter-section {
      margin-bottom: 40px;

      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-pill {
      padding: 8px 18px;
      border-radius: 24px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1.5px solid var(--border-light);
      background: var(--bg-card);
      color: var(--text-secondary);
    }

    .filter-pill:hover {
      border-color: var(--accent-teal);
      color: var(--accent-teal);
      transform: translateY(-1px);
    }

    .filter-pill.active {
      background: var(--accent-teal);
      border-color: var(--accent-teal);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .filter-pill[data-country="all"].active {
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    /* Country section */
    .country-section {
      margin-bottom: 48px;
    }

    .country-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-light);

      font-size: 1.5rem;
      font-weight: 700;
    }

    }

      color: var(--text-muted);
      background: var(--bg-primary);
      padding: 4px 10px;
      border-radius: 12px;
      margin-left: auto;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media (max-width: 1024px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }

      border: 1px solid var(--border-light);
      overflow: hidden;
      transition: all 0.25s ease;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;

      box-shadow: var(--shadow-lg);
      border-color: transparent;
    }

      height: 4px;
    }

    .card-accent.amber {

    }

    .card-accent.teal {
      background: linear-gradient(90deg, var(--accent-teal), #14B8A6);
    }

      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.8rem;

    }

      -webkit-box-orient: vertical;
      overflow: hidden;

      -webkit-box-orient: vertical;
      overflow: hidden;

      border-radius: 4px;
      text-transform: uppercase;

      color: #B45309;

      color: #0E8078;

    .tag.platform {

      color: #6B21A8;

      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);

      color: var(--text-muted);
      max-width: 70%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      font-weight: 600;
      color: var(--accent-teal);
      text-decoration: none;

      align-items: center;
      gap: 4px;

      height: 64px;
      margin-bottom: 16px;

      background: var(--text-primary);
      color: rgba(255,255,255,0.7);

      text-align: center;
      font-size: 0.85rem;

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }

      animation: fadeIn 0.4s ease forwards;
    }

    .country-section:nth-child(3) { animation-delay: 0.1s; }
    .country-section:nth-child(4) { animation-delay: 0.15s; }
    .country-section:nth-child(5) { animation-delay: 0.2s; }
    .country-section:nth-child(6) { animation-delay: 0.25s; }
    .country-section:nth-child(7) { animation-delay: 0.3s; }
    .country-section:nth-child(8) { animation-delay: 0.35s; }
    .country-section:nth-child(9) { animation-delay: 0.4s; }

    /* Hidden cards */
    .news-card.hidden {
      display: none;
    }
  </style>
</head>

    // Sort by date descending
    articles.sort((a, b) => new Date(b.date) - new Date(a.date));

    // Get week number
    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
      var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      var weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
      return weekNo;
    }

    // Format date
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    // Calculate reading time
    function getReadingTime(text) {
      const words = text.split(/\s+/).length;
      const minutes = Math.ceil(words / 200);
      return `${minutes}分钟阅读`;
    }

    // Get country order
    function getCountryOrder(country) {
      const order = ['Cambodia', 'Laos', 'Vietnam', 'Thailand', 'Myanmar', 'Malaysia', 'Indonesia', 'Philippines', 'ASEAN'];
      return order.indexOf(country);
    }

    // Initialize
    function init() {
      // Header meta
      const now = new Date();
      document.getElementById('current-date').textContent = formatDate(now);
      document.getElementById('week-number').textContent = getWeekNumber(now);
      document.getElementById('article-count').textContent = articles.length;
      document.getElementById('last-updated').textContent = formatDate(now);

      // Build filter pills
      const filterPills = document.getElementById('filter-pills');
      const countries = ['all', ...Object.keys(countryConfig)];
      
      countries.forEach(country => {
        const pill = document.createElement('button');
        pill.className = 'filter-pill' + (country === 'all' ? ' active' : '');
        pill.dataset.country = country;
        
        if (country === 'all') {
          pill.textContent = '全部';
        } else {
          pill.textContent = `${countryConfig[country].flag} ${countryConfig[country].name}`;
        }
        
        pill.addEventListener('click', () => filterByCountry(country));
        filterPills.appendChild(pill);
      });

      // Group articles by country
      const grouped = {};
      articles.forEach(article => {
        // Use first non-China country or ASEAN
        let country = article.countries.find(c => c !== 'China') || article.countries[0];
        
        if (!grouped[country]) {
          grouped[country] = [];
        }
        grouped[country].push(article);
      });

      // Render
      const container = document.getElementById('news-container');
      
      // Sort groups
      const sortedCountries = Object.keys(grouped).sort((a, b) => getCountryOrder(a) - getCountryOrder(b));
      
      sortedCountries.forEach(country => {
        const countryArticles = grouped[country];
        if (!countryConfig[country]) return;
        
        const section = document.createElement('section');
        section.className = 'country-section';
        section.dataset.country = country;
        
        section.innerHTML = `
          <div class="country-header">
            <span class="flag">${countryConfig[country].flag}</span>
            <h2>${countryConfig[country].name}</h2>
            <span class="count">${countryArticles.length} 条</span>
          </div>
          <div class="card-grid"></div>
        `;
        
        const grid = section.querySelector('.card-grid');
        
        countryArticles.forEach(article => {
          const card = document.createElement('article');
          card.className = 'news-card';
          card.dataset.countries = article.countries.join(',');
          
          const accentClass = article.category === 'existing_cooperation' ? 'amber' : 'teal';
          const tagClass = article.category === 'existing_cooperation' ? 'cooperation' : 
                          article.category === 'regional_platform' ? 'platform' : 'needs';
          
          const flags = article.countries.map(c => countryConfig[c]?.flag || '🌐').join(' ');
          
          card.innerHTML = `
            <div class="card-accent ${accentClass}"></div>
            <div class="card-content">
              <div class="card-meta">
                <span class="card-date">${formatDate(article.date)}</span>
                <span class="card-reading-time">${getReadingTime(article.summary)}</span>
              </div>
              <div class="card-flags">${flags}</div>
              <h3 class="card-title">${article.title}</h3>
              <p class="card-excerpt">${article.summary}</p>
              <div class="card-tags">
                <span class="tag ${tagClass}">${tagLabels[article.category]}</span>
              </div>
              <div class="card-footer">
                <span class="card-source">${article.source}</span>
                <a href="${article.url}" target="_blank" rel="noopener" class="card-link">
                  阅读原文
                  <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16"><path d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1.002 1.002 0 0 1-.152.546c-.094.244-.246.487-.414.698a.5.5 0 0 1-.11.137l-2.055 1.36c-.461.256-.82.546-1.064.742a.5.5 0 0 1-.706 0c-.26-.195-.603-.486-.764-.742a.992.992 0 0 1-.152-.546c.094-.244.246-.487.414-.698.1-.103.198-.201.293-.334l1.36-2.055a.5.5 0 0 1 .11-.137c.26-.196.49-.39.706-.5l1.828-1.828a3 3 0 0 0 0-4.243L9.929.343a3 3 0 0 0-4.243 4.243l.371.707zM8 10.93a1 1 0 0 1 .292-.707l1.36-1.828a1 1 0 0 1 1.414 0l1.828 1.828a1 1 0 0 1 0 1.414l-1.828 1.828a1 1 0 0 1-1.414 0L8 11.636a1 1 0 0 1-.292-.707z"/></svg>
                </a>
              </div>
            </div>
          `;
          
          grid.appendChild(card);
        });
        
        container.appendChild(section);
      });
    }

    // Filter function
    function filterByCountry(country) {
      // Update pills
      document.querySelectorAll('.filter-pill').forEach(pill => {
        pill.classList.toggle('active', pill.dataset.country === country);
      });
      
      // Show/hide sections
      document.querySelectorAll('.country-section').forEach(section => {
        if (country === 'all') {
          section.style.display = '';
        } else {
          section.style.display = section.dataset.country === country ? '' : 'none';
        }
      });
    }

    init();
  </script>
