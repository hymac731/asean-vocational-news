<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>东盟职教情报</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0A0B;
      --surface: #141416;
      --surface2: #1C1C1F;
      --border: rgba(255,255,255,0.08);
      --text: #FAFAFA;
      --text-2: #8A8A8E;
      --text-3: #5C5C5E;
      --accent: #FF4D00;
      --accent-2: #FFB300;
      --green: #00C853;
      --blue: #2979FF;
      --purple: #A855F7;
      --radius: 16px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,11,0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: white;
      letter-spacing: -0.5px;
    }

    .logo-text {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--text-2);
      font-weight: 400;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-2);
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .stat-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Hero ── */
    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 24px 48px;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(255,77,0,0.1);
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,77,0,0.2);
    }

    .hero h1 {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    .hero h1 .accent {
      color: var(--accent);
    }

    .hero-desc {
      font-size: 1.1rem;
      color: var(--text-2);
      max-width: 540px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .hero-meta {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-3);
    }

    .meta-item svg { opacity: 0.6; }

    /* ── Filter ── */
    .filter-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn:hover {
      background: var(--surface);
      color: var(--text);
      border-color: rgba(255,255,255,0.15);
    }

    .filter-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* ── Main grid ── */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* Featured card (first card, full width) */
    .card-featured {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 0;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
      cursor: pointer;
    }

    .card-featured:hover {
      border-color: rgba(255,255,255,0.15);
    }

    .card-featured:hover .featured-title {
      color: var(--accent);
    }

    .featured-body {
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .featured-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tag-chip {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .tag-chip.cooperation { background: rgba(255,179,0,0.15); color: var(--accent-2); }
    .tag-chip.policy { background: rgba(0,200,83,0.12); color: var(--green); }
    .tag-chip.platform { background: rgba(168,85,247,0.12); color: var(--purple); }

    .date-badge {
      font-size: 0.75rem;
      color: var(--text-3);
    }

    .featured-title {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--text);
      transition: color 0.2s;
    }

    .featured-summary {
      font-size: 0.9rem;
      color: var(--text-2);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .featured-meta {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .featured-source {
      font-size: 0.75rem;
      color: var(--text-3);
    }

    .read-btn {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      transition: gap 0.2s;
    }

    .read-btn:hover { gap: 8px; }

    .featured-img {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      position: relative;
      overflow: hidden;
    }

    .featured-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 60%, rgba(10,10,11,0.6) 100%);
    }

    /* Regular card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media (max-width: 900px) {
      .card-featured { grid-template-columns: 1fr; }
      .featured-img { display: none; }
      .card-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .card-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s, transform 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }

    .card:hover .card-title { color: var(--accent); }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-date { font-size: 0.72rem; color: var(--text-3); }

    .card-flags { font-size: 1rem; letter-spacing: 1px; }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s;
    }

    .card-summary {
      font-size: 0.78rem;
      color: var(--text-2);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .card-source {
      font-size: 0.68rem;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65%;
    }

    .card-link-icon {
      font-size: 0.7rem;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover .card-link-icon { opacity: 1; }

    /* Country divider */
    .country-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 32px 0 16px;
    }

    .country-divider .flag { font-size: 1.4rem; }

    .country-divider h2 {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .country-divider .line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      text-align: center;
    }

    .footer p {
      font-size: 0.75rem;
      color: var(--text-3);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .footer-update {
      margin-top: 8px;
      font-size: 0.7rem;
      color: var(--text-3);
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-featured, .card, .country-divider {
      animation: fadeUp 0.5s ease forwards;
    }

    /* Hidden */
    .hidden { display: none !important; }
  </style>
</head>

  <!-- Cards -->

    const articles = [

      { title: "2024"中文+水电职业技能"培训向柬埔寨开放", url: "https://gxsdxy.cn/ywz/Admission/Training_Programs.htm", source: "广西水利电力职院", date: "2024-07-12", countries: ["Cambodia", "China"], category: "existing_cooperation", summary: "广西水利电力职院与华电柬埔寨公司联合推出线上培训项目，培养海外水电人才，服务中资企业在柬埔寨的发展。" },

    articles.sort((a, b) => new Date(b.date) - new Date(a.date));

    function getWeekLabel() {
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 1);
      const week = Math.ceil(((now - start) / 86400000 + start.getDay() + 1) / 7);
      return `第${week}周`;
    }

    function formatDateCN(d) {
      return new Date(d).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function init() {
      const now = new Date();
      document.getElementById('current-date').textContent = formatDateCN(now);
      document.getElementById('week-label').textContent = getWeekLabel();
      document.getElementById('article-count').textContent = articles.length;
      document.getElementById('article-count-header').textContent = `${articles.length} 条动态`;
      document.getElementById('last-updated').textContent = formatDateCN(now);

      // Filter bar
      const filterBar = document.getElementById('filter-bar');
      const countries = ['all', ...Object.keys(countryConfig)];
      countries.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (c === 'all' ? ' active' : '');
        btn.dataset.country = c;
        btn.textContent = c === 'all' ? '全部' : `${countryConfig[c].flag} ${countryConfig[c].name}`;
        btn.addEventListener('click', () => filterByCountry(c));
        filterBar.appendChild(btn);
      });

      renderCards();
    }

    function filterByCountry(country) {
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.country === country);
      });

      document.querySelectorAll('.country-group').forEach(g => {
        g.style.display = country === 'all' || g.dataset.country === country ? '' : 'none';
      });
    }

    function renderCards() {
      const main = document.getElementById('news-main');

      // Group
      const grouped = {};
      articles.forEach(a => {
        const c = a.countries.find(x => x !== 'China') || a.countries[0];
        if (!grouped[c]) grouped[c] = [];
        grouped[c].push(a);
      });

      const order = ['Cambodia','Laos','Vietnam','Thailand','Myanmar','Malaysia','Indonesia','Philippines','ASEAN'];

      order.forEach((country, idx) => {
        if (!grouped[country]) return;
        const groupDiv = document.createElement('div');
        groupDiv.className = 'country-group';
        groupDiv.dataset.country = country;

        // Divider
        const divider = document.createElement('div');
        divider.className = 'country-divider';
        divider.innerHTML = `<span class="flag">${countryConfig[country].flag}</span><h2>${countryConfig[country].name}</h2><div class="line"></div>`;
        groupDiv.appendChild(divider);

        const cards = grouped[country];

        // Featured card (first)
        const feat = cards[0];
        const featTag = tagConfig[feat.category];
        const featCard = document.createElement('a');
        featCard.className = 'card-featured';
        featCard.href = feat.url;
        featCard.target = '_blank';
        featCard.rel = 'noopener';
        featCard.style.animationDelay = `${idx * 0.05}s`;

        const imgFlags = feat.countries.map(c => countryConfig[c]?.flag || '🌐').join('');
        featCard.innerHTML = `
          <div class="featured-body">
            <div class="featured-eyebrow">
              <span class="tag-chip ${featTag.cls}">${featTag.label}</span>
              <span class="date-badge">${formatDateCN(feat.date)}</span>
            </div>
            <h3 class="featured-title">${feat.title}</h3>
            <p class="featured-summary">${feat.summary}</p>
            <div class="featured-meta">
              <span class="featured-source">${feat.source}</span>
              <a href="${feat.url}" target="_blank" rel="noopener" class="read-btn" onclick="event.stopPropagation()">
                阅读原文 →
              </a>
            </div>
          </div>
          <div class="featured-img">${imgFlags}</div>
        `;
        groupDiv.appendChild(featCard);

        // Rest of cards
        if (cards.length > 1) {
          const grid = document.createElement('div');
          grid.className = 'card-grid';

          cards.slice(1).forEach((a, i) => {
            const tag = tagConfig[a.category];
            const flags = a.countries.map(c => countryConfig[c]?.flag || '🌐').join('');
            const card = document.createElement('a');
            card.className = 'card';
            card.href = a.url;
            card.target = '_blank';
            card.rel = 'noopener';
            card.style.animationDelay = `${idx * 0.05 + (i + 1) * 0.04}s`;
            card.innerHTML = `
              <div class="card-top">
                <span class="card-date">${formatDateCN(a.date)}</span>
                <span class="card-flags">${flags}</span>
              </div>
              <h3 class="card-title">${a.title}</h3>
              <p class="card-summary">${a.summary}</p>
              <div class="card-bottom">
                <span class="card-source">${a.source}</span>
                <span class="card-link-icon">→</span>
              </div>
            `;
            grid.appendChild(card);
          });

          groupDiv.appendChild(grid);
        }

        main.appendChild(groupDiv);
      });
    }

    init();
  </script>
